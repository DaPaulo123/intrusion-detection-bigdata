apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-serving-deployment
  labels:
    app: soc-serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: soc-serving
  template:
    metadata:
      labels:
        app: soc-serving
    spec:
      containers:
      - name: soc-serving-api
        image: intrusion-detection-serving:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URI
          value: "mongodb://mongodb:27017/"
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: SECRET_KEY
          value: "k8s_super_secure_session_key_2026"
        - name: API_KEY
          value: "SOC-Super-Secret-2026"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: soc-serving-service
spec:
  type: NodePort
  selector:
    app: soc-serving
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30050
