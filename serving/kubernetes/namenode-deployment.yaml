apiVersion: apps/v1
kind: Deployment
metadata:
  name: namenode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: namenode
  template:
    metadata:
      labels:
        app: namenode
    spec:
      containers:
      - name: namenode
        image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
        ports:
        - containerPort: 9870
        - containerPort: 8020
        env:
        - name: CLUSTER_NAME
          value: "intrusion-detection"
        - name: CORE_CONF_fs_defaultFS
          value: "hdfs://namenode:8020"
        - name: HDFS_CONF_dfs_replication
          value: "1"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          resources:
          limits:
            memory: "256Mi"
            cpu: "300m"
