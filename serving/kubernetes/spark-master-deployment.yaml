apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-cluster-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      containers:
      - name: spark-master
        image: apache/spark:3.4.1
        ports:
        - containerPort: 8080
        - containerPort: 7077
        command: ["/opt/spark/bin/spark-class"]
        args: ["org.apache.spark.deploy.master.Master"]
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
---