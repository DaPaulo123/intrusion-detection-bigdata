apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-cluster-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
      - name: spark-worker
        image: apache/spark:3.4.1
        ports:
        - containerPort: 8081
        command: 
        - "/opt/spark/bin/spark-class"
        args: 
        - "org.apache.spark.deploy.worker.Worker"
        - "spark://spark-cluster-master:7077"
        env:
        - name: SPARK_WORKER_MEMORY
          value: "4G"
        resources:
          requests:
            memory: "1Gi"
            cpu: "100m"
          resources:
          limits:
            memory: "2Gi"
            cpu: "500m"
---